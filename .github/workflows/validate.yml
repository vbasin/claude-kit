name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hook tests
        run: |
          python -m pip install --quiet pytest ruff
          python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate marketplace and plugins
        run: |
          npm install --global --silent @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate ./plugins/kit
          claude plugin validate ./plugins/quant
